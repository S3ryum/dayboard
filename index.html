<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small private task board that stays in your browser.">
    <title>DayBoard</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./dist/main.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="top"><div>
        <p class="eyebrow">A calmer way to plan today</p>
        <h1>DayBoard</h1>
        <p class="intro">Small steps, all in one place. Your tasks stay in this browser.</p>
      </div><span class="local-badge"><span aria-hidden="true">●</span> Saved locally</span></header>
      <section class="panel" aria-labelledby="add-title">
        <h2 id="add-title">Add a task</h2>
        <form id="task-form">
          <label class="visually-hidden" for="task-input">Task description</label>
          <input id="task-input" name="task" maxlength="120" placeholder="What would you like to finish?" required>
          <button type="submit">Add task</button>
        </form>
      </section>
      <section class="list-panel" aria-labelledby="list-title">
        <div class="list-heading"><div><h2 id="list-title">Your list</h2><p id="task-count" class="muted">0 tasks</p></div>
          <label class="filter-label" for="filter">Show
            <select id="filter"><option value="all">all</option><option value="open">to do</option><option value="done">completed</option></select>
          </label>
        </div>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty">A clear page is a good place to start.</p>
      </section>
      <footer>DayBoard · no account, no cloud, just your day.</footer>
    </main>
  </body>
</html>
